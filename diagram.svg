<svg width="1400" height="1000" xmlns="http://www.w3.org/2000/svg">
    <style>
        rect { fill: #f9f9f9; stroke: #333; stroke-width: 2; }
        text { font-family: Arial, sans-serif; font-size: 13px; }
        .class-title { font-weight: bold; font-size: 15px; fill: #2c3e50; }
        .abstract { font-style: italic; }
        .line { stroke: #333; stroke-width: 2; }
        .inheritance { stroke-dasharray: 5,5; }
        .arrow { fill: #333; }
    </style>

    <!-- Classe abstraite Media -->
    <rect x="50" y="50" width="320" height="190"/>
    <text x="65" y="80" class="class-title abstract">Media (abstraite)</text>
    <text x="65" y="105">Titre, auteur, année, disponible</text>
    <text x="65" y="130">afficher(), getType(), getTitre(),</text>
    <text x="65" y="155">estDisponible()</text>

    <!-- Classe Livre -->
    <rect x="480" y="50" width="300" height="160"/>
    <text x="495" y="80" class="class-title">Livre</text>
    <text x="495" y="105">Nbpages, Editeur</text>
    <text x="495" y="130">getNbPages(), getEditeur()</text>

    <!-- Classe Audio -->
    <rect x="480" y="250" width="300" height="160"/>
    <text x="495" y="280" class="class-title">Audio</text>
    <text x="495" y="305">a_Durée, format</text>
    <text x="495" y="330">getDuree(), getFormat()</text>

    <!-- Classe LivreAudio -->
    <rect x="880" y="150" width="320" height="160"/>
    <text x="895" y="180" class="class-title">LivreAudio</text>
    <text x="895" y="205">Attributs de Livre et Audio</text>
    <text x="895" y="230">Méthodes héritées</text>

    <!-- Classe Vidéo -->
    <rect x="880" y="350" width="300" height="160"/>
    <text x="895" y="380" class="class-title">Vidéo</text>
    <text x="895" y="405">resolution</text>
    <text x="895" y="430">getResolution()</text>

    <!-- Classe Bibliothèque -->
    <rect x="50" y="350" width="340" height="180"/>
    <text x="65" y="380" class="class-title">Bibliothèque</text>
    <text x="65" y="405">vector&lt;shared_ptr&lt;Media&gt;&gt;</text>
    <text x="65" y="430">medias</text>
    <text x="65" y="455">ajouterMedia(), supprimerMedia(),</text>
    <text x="65" y="480">rechercherParTitre()</text>

    <!-- Classe Utilisateur -->
    <rect x="480" y="450" width="300" height="160"/>
    <text x="495" y="480" class="class-title">Utilisateur</text>
    <text x="495" y="505">username, password, estAdmin</text>
    <text x="495" y="530">authentifier(),</text>
    <text x="495" y="555">estAdministrateur()</text>

    <!-- Classe Lecteur -->
    <rect x="880" y="550" width="320" height="160"/>
    <text x="895" y="580" class="class-title">Lecteur</text>
    <text x="895" y="605">mediaCourant, positionLecture,</text>
    <text x="895" y="630">estEnLecture</text>
    <text x="895" y="655">chargerMedia(), play(), pause()</text>

    <!-- Classe Statistiques -->
    <rect x="50" y="550" width="320" height="160"/>
    <text x="65" y="580" class="class-title">Statistiques</text>
    <text x="65" y="605">Référence à Bibliothèque</text>
    <text x="65" y="630">afficherStatsParType(),</text>
    <text x="65" y="655">afficherMoyenneDuree()</text>

    <!-- Classe MediaException -->
    <rect x="480" y="650" width="300" height="160"/>
    <text x="495" y="680" class="class-title">MediaException</text>
    <text x="495" y="705">message, codeErreur</text>
    <text x="495" y="730">what(), getCode()</text>

    <!-- Classe FichierManager -->
    <rect x="880" y="750" width="300" height="160"/>
    <text x="895" y="780" class="class-title">FichierManager</text>
    <text x="895" y="805">cheminFichier</text>
    <text x="895" y="830">sauvegarder(), charger()</text>

    <!-- Héritage Media -> Livre -->
    <line x1="370" y1="115" x2="480" y2="115" class="line inheritance"/>
    <polygon points="480,115 470,110 470,120" class="arrow"/>

    <!-- Héritage Media -> Audio -->
    <line x1="370" y1="150" x2="480" y2="275" class="line inheritance"/>
    <polygon points="480,275 470,270 470,280" class="arrow"/>

    <!-- Héritage Livre -> LivreAudio -->
    <line x1="780" y1="130" x2="880" y2="185" class="line inheritance"/>
    <polygon points="880,185 870,180 870,190" class="arrow"/>

    <!-- Héritage Audio -> LivreAudio -->
    <line x1="780" y1="325" x2="880" y2="230" class="line inheritance"/>
    <polygon points="880,230 870,225 870,235" class="arrow"/>

    <!-- Héritage Audio -> Vidéo -->
    <line x1="780" y1="380" x2="880" y2="400" class="line inheritance"/>
    <polygon points="880,400 870,395 870,405" class="arrow"/>

    <!-- Association Bibliothèque -> Media -->
    <line x1="220" y1="350" x2="220" y2="240" class="line"/>
    <polygon points="220,240 215,250 225,250" class="arrow"/>

    <!-- Association Lecteur -> Media -->
    <line x1="1040" y1="550" x2="1040" y2="510" class="line"/>
    <polygon points="1040,510 1035,520 1045,520" class="arrow"/>

    <!-- Association Statistiques -> Bibliothèque -->
    <line x1="210" y1="550" x2="210" y2="530" class="line"/>
    <polygon points="210,530 205,540 215,540" class="arrow"/>

    <!-- Association FichierManager -> Bibliothèque -->
    <line x1="1040" y1="750" x2="220" y2="530" class="line"/>
    <polygon points="220,530 215,540 225,540" class="arrow"/>
</svg>